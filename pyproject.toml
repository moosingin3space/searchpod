[project]
name = "searchpod"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "uuid7>=0.1.0",
    "anyio>=4.0.0",
    "reboot==1.4.0",
    # The OpenRouter provider for `reboot.agents.pydantic_ai.Agent`, used
    # only by the Spotify guest-name inference. Pinned to the exact
    # version `reboot==1.4.0` already resolves, so adding the extra pulls
    # in the provider client without moving pydantic-ai itself.
    "pydantic-ai-slim[openrouter]==1.87.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.1",
    "pytest>=7.4.2",
    "types-protobuf>=4.24.0.20240129",
]
