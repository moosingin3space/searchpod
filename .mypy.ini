# .mypy.ini — documented at
#   https://mypy.readthedocs.io/en/stable/config_file.html
[mypy]
warn_unused_configs = True

# Find modules in our source tree (and tests). Since `protoc` doesn't
# generate `__init__.py` files, treat these as explicit package bases:
#   https://mypy.readthedocs.io/en/stable/running_mypy.html#mapping-file-paths-to-modules
mypy_path = backend/tests:backend/src:backend/api:api
explicit_package_bases = True

# Stricter than the default, but cheap to adhere to and high value.
check_untyped_defs = True
strict_equality = True

# gRPC stubs ship incomplete type info; don't flag them.
[mypy-google.api.*]
ignore_missing_imports = True
[mypy-google.rpc.*]
ignore_missing_imports = True
[mypy-grpc.*]
ignore_missing_imports = True
[mypy-grpc_status.*]
ignore_missing_imports = True
# `uuid7` ships no type information.
[mypy-uuid7]
ignore_missing_imports = True

# The generated `*_rbt.py` for our API package is not hand-written;
# don't type-check it (we never edit it anyway).
[mypy-searchpod.v1.podcasts_rbt]
ignore_errors = True
ignore_missing_imports = True
[mypy-searchpod.v1.spotify_rbt]
ignore_errors = True
ignore_missing_imports = True
